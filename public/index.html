<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Видеонаблюдение Amatek</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230ea5e9'/%3E%3Cpath d='M5 8h10v8H5z' fill='%23fff'/%3E%3Cpath d='M16 11l3-2v6l-3-2z' fill='%23fff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- ---------------------------------------------------------- вход -->
    <div class="auth-screen" id="authScreen" hidden>
      <form class="auth-card" id="authForm" autocomplete="on">
        <div class="brand">
          <span class="brand-mark">AM</span>
          <div>
            <h1 id="authTitle">Вход в систему</h1>
            <p id="authSubtitle">Видеонаблюдение Amatek</p>
          </div>
        </div>

        <label class="field">
          <span>Логин</span>
          <input name="username" id="authUsername" required minlength="3" autocomplete="username" placeholder="admin" />
        </label>

        <label class="field" id="authDisplayWrap" hidden>
          <span>Имя для отображения</span>
          <input name="displayName" id="authDisplayName" autocomplete="name" placeholder="Администратор" />
        </label>

        <label class="field">
          <span>Пароль</span>
          <input name="password" id="authPassword" type="password" required minlength="8" autocomplete="current-password" placeholder="Минимум 8 символов" />
        </label>

        <label class="field" id="authConfirmWrap" hidden>
          <span>Повторите пароль</span>
          <input name="confirm" id="authConfirm" type="password" minlength="8" autocomplete="new-password" />
        </label>

        <p class="auth-error" id="authError" hidden></p>
        <button class="btn btn-primary btn-block" id="authSubmit" type="submit">Войти</button>
        <p class="auth-hint" id="authHint"></p>
      </form>
    </div>

    <!-- ---------------------------------------------------------- приложение -->
    <div class="app" id="app" hidden>
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="sidebarToggle" title="Список камер" aria-label="Список камер">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="brand small">
            <span class="brand-mark">AM</span>
            <div>
              <h1 id="appTitle">Видеонаблюдение Amatek</h1>
              <p id="appSubtitle">—</p>
            </div>
          </div>
        </div>

        <div class="topbar-center">
          <input class="search" id="search" type="search" placeholder="Поиск камеры…" />
        </div>

        <div class="topbar-right">
          <div class="seg" id="layoutPicker" title="Раскладка">
            <button data-layout="1" title="1 камера">1</button>
            <button data-layout="2" class="active" title="4 камеры">2×2</button>
            <button data-layout="3" title="9 камер">3×3</button>
            <button data-layout="4" title="16 камер">4×4</button>
          </div>
          <button class="btn btn-ghost" id="presetBtn" title="Сохранить текущий набор как пресет">Пресет</button>
          <div class="user-menu">
            <button class="user-btn" id="userBtn">
              <span class="avatar" id="userAvatar">?</span>
              <span id="userName">—</span>
              <svg viewBox="0 0 24 24" class="chev"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="dropdown" id="userDropdown" hidden>
              <button data-action="profile">Сменить пароль</button>
              <button data-action="users" id="usersMenuItem" hidden>Пользователи</button>
              <button data-action="diagnostics">Диагностика</button>
              <button data-action="logout" class="danger">Выйти</button>
            </div>
          </div>
        </div>
      </header>

      <div class="body">
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-section">
            <h2>Группы</h2>
            <div class="chips" id="groupChips"></div>
          </div>
          <div class="sidebar-section">
            <h2>Пресеты</h2>
            <div class="presets" id="presetsList"><p class="muted">Пока нет сохранённых наборов</p></div>
          </div>
          <div class="sidebar-section">
            <h2>Все камеры <span class="count" id="cameraCount">0</span></h2>
            <div class="camera-list" id="cameraList"></div>
          </div>
          <div class="sidebar-footer">
            <div class="health-line"><span class="dot" id="healthDot"></span><span id="healthText">Проверка связи…</span></div>
            <button class="link-btn" id="diagnosticsLink">Диагностика системы</button>
          </div>
        </aside>

        <main class="stage">
          <div class="notice" id="notice" hidden></div>
          <div class="grid" id="grid" data-layout="2"></div>
          <div class="empty" id="emptyState" hidden>
            <h2>Камеры не найдены</h2>
            <p>Добавьте устройства в файл <code>config/cameras.json</code> — изменения подхватываются без перезапуска.</p>
          </div>
        </main>
      </div>
    </div>

    <!-- ---------------------------------------------------------- модальные окна -->
    <div class="modal" id="modal" hidden>
      <div class="modal-card">
        <header class="modal-head">
          <h2 id="modalTitle">—</h2>
          <button class="icon-btn" id="modalClose" aria-label="Закрыть">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </header>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <div class="toasts" id="toasts"></div>

    <template id="tileTemplate">
      <article class="tile">
        <video class="tile-video" muted playsinline autoplay></video>
        <div class="tile-poster"></div>
        <div class="tile-overlay">
          <span class="tile-name"></span>
          <span class="tile-badge"></span>
        </div>
        <div class="tile-actions">
          <button data-act="solo" title="На весь экран сетки">Одна</button>
          <button data-act="quality" title="Переключить основной/дополнительный поток">sub</button>
          <button data-act="fullscreen" title="Полный экран">⛶</button>
          <button data-act="snapshot" title="Снимок кадра">⤓</button>
          <button data-act="diag" title="Диагностика камеры">i</button>
        </div>
        <div class="tile-error" hidden></div>
      </article>
    </template>

    <script src="/vendor/hls.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
